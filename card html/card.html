<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        .card {
            background-color: #E3F2FD;
            width: 450px;
            height: 280px;
            box-sizing: border-box;
            border-radius: 20px;
            box-shadow: 0px 4px 4px 2px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin:auto;

        }
        
        .card header {
            background-color: #90CAF9;
            color: white;
            padding: 8px;
            letter-spacing: 10px;
            text-align: center;
            font-size: 20px;
        }

        .card header h1 {
            margin: 0;
        }

        .card main {
            padding: 30px;
            display: flex;
            gap: 50px;
            line-height: 1;
            
        }
        .card img {
            width: 140px;
            height: 160px;
            border: 1px solid black;
            object-fit: cover;
            box-shadow: 0px 2px 2px 2px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .card h2 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            margin-top: 0;
        }

        .card p {
            font-family: Arial;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <header>
            <h1> CORTIS</h1>
        </header>

        <main>
        <img src="suamigue(1)(1).jpg" alt="Foto Edwards Martin">

        <div>
            <h2>NAME</h2>
            <p>Edwards Martin</p>
            <h2>DATE OF BIRTH</h2>
            <p>20 Maret 2008</p>
            <h2>TEAM</h2>
            <p>Color Outside Line</p>
        </div>
        </main>
    </div>

</body>
</html>
